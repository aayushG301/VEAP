name: Security
on: { push: {}, schedule: [{ cron: "0 3 * * 1" }] }
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
